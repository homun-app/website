server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	error_page 404 /404.html;

	# The short install of the Engramma page (curl -LsSf homun.app/engramma/install.sh | sh):
	# a redirect, never a copy, to the installer of the current release.
	# scripts/check-engramma.mjs keeps this address equal to ENGRAMMA_RELEASE.installerUrl.
	# 302 and not 301: the address changes with every release and must not stay cached.
	location = /engramma/install.sh {
		return 302 https://github.com/homun-app/engramma/releases/download/v0.6.20-beta.1/engramma-cli-installer.sh;
	}

	location / {
		try_files $uri $uri/ =404;
	}

	location = /404.html {
		internal;
	}
}
